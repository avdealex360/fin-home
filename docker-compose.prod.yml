services:
  budget-app:
    ports: !reset []
    expose:
      - "8000"

  sqlite-web:
    ports: !reset []
    expose:
      - "8080"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80/tcp"
      - "443:443/tcp"
    environment:
      - APP_USER=${APP_USER}
      - APP_PASSWORD_HASH=${APP_PASSWORD_HASH}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./certs:/certs:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - budget-app
      - sqlite-web

volumes:
  caddy_data:
  caddy_config:
