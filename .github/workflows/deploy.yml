name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check secrets
        run: |
          set -e
          missing=0
          if [ -z "${{ secrets.VPS_HOST }}" ]; then
            echo "::error::Secret VPS_HOST не задан. Settings → Secrets → Actions"
            missing=1
          fi
          if [ -z "${{ secrets.VPS_USER }}" ]; then
            echo "::error::Secret VPS_USER не задан (обычно: deploy)"
            missing=1
          fi
          if [ -z "${{ secrets.VPS_SSH_KEY }}" ]; then
            echo "::error::Secret VPS_SSH_KEY не задан (приватный SSH-ключ)"
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
          echo "Secrets OK"

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd ${VPS_APP_PATH:-/opt/fin-home}
            git fetch origin main && git reset --hard origin/main
            chmod +x scripts/*.sh
            bash scripts/deploy.sh
