{% extends "base.html" %}
{% block title %}Редактировать операцию — Семейный бюджет{% endblock %}
{% block content %}

<h1 class="text-2xl font-bold mb-4">Редактировать операцию</h1>

<form method="post" action="/transactions/{{ transaction.id }}" class="space-y-3" id="tx-form">
    <select name="type" id="tx-type" class="w-full p-3 border rounded-xl bg-white" required>
        <option value="expense" {% if transaction.type == 'expense' %}selected{% endif %}>Расход</option>
        <option value="income" {% if transaction.type == 'income' %}selected{% endif %}>Доход</option>
        <option value="transfer" {% if transaction.type == 'transfer' %}selected{% endif %}>В сбережения</option>
    </select>
    <input type="text" name="amount" inputmode="decimal" placeholder="Сумма, ₽" required
        value="{{ transaction.amount }}" class="w-full p-3 border rounded-xl" enterkeyhint="done">
    <div id="eur-field" class="{% if transaction.type != 'income' %}hidden{% endif %}">
        <input type="text" name="base_amount_eur" inputmode="decimal" placeholder="Сумма в EUR"
            value="{% if transaction.base_amount_eur %}{{ transaction.base_amount_eur }}{% endif %}"
            class="w-full p-3 border rounded-xl" enterkeyhint="done">
    </div>
    <select name="category_id" id="category-select" class="w-full p-3 border rounded-xl bg-white">
        <option value="">— Категория —</option>
        <optgroup label="Расходы" id="expense-cats" {% if transaction.type == 'income' %}class="hidden"{% endif %}>
            {% for cat in categories %}
            <option value="{{ cat.id }}" {% if transaction.category_id == cat.id %}selected{% endif %}>{{ cat.name }}</option>
            {% endfor %}
        </optgroup>
        <optgroup label="Доходы" id="income-cats" {% if transaction.type != 'income' %}class="hidden"{% endif %}>
            {% for cat in income_categories %}
            <option value="{{ cat.id }}" {% if transaction.category_id == cat.id %}selected{% endif %}>{{ cat.name }}</option>
            {% endfor %}
        </optgroup>
    </select>
    <input type="date" name="date" value="{{ transaction.date.isoformat() }}" class="w-full p-3 border rounded-xl">
    <select name="user_id" class="w-full p-3 border rounded-xl bg-white">
        <option value="">— Кто внёс —</option>
        {% for u in users %}
        <option value="{{ u.id }}" {% if transaction.user_id == u.id %}selected{% endif %}>{{ u.name }}</option>
        {% endfor %}
    </select>
    <input type="text" name="comment" placeholder="Комментарий"
        value="{% if transaction.comment %}{{ transaction.comment }}{% endif %}"
        class="w-full p-3 border rounded-xl" enterkeyhint="done">
    <div class="form-sticky-footer space-y-2">
        <button type="submit" class="btn-primary">Сохранить</button>
        <a href="/" class="btn-secondary text-center">Отмена</a>
    </div>
</form>
<script>
document.getElementById('tx-type').addEventListener('change', function() {
    const isIncome = this.value === 'income';
    document.getElementById('eur-field').classList.toggle('hidden', !isIncome);
    document.getElementById('expense-cats').classList.toggle('hidden', isIncome);
    document.getElementById('income-cats').classList.toggle('hidden', !isIncome);
});
</script>
{% endblock %}
