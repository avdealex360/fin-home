<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>{% block title %}Семейный бюджет{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen">
    <nav class="bg-white border-b border-slate-200 sticky top-0 z-10 hidden sm:block">
        <div class="max-w-3xl mx-auto px-4 py-3">
            <div class="flex items-center justify-between gap-2 mb-2">
                <a href="/" class="font-bold text-lg text-indigo-700 shrink-0">Семейный бюджет</a>
            </div>
            <div class="flex flex-wrap gap-1 text-sm nav-scroll overflow-x-auto">
                <a href="/" class="px-3 py-2 rounded-lg hover:bg-slate-100 whitespace-nowrap">Дашборд</a>
                <a href="/plan" class="px-3 py-2 rounded-lg hover:bg-slate-100 whitespace-nowrap">План</a>
                <a href="/analytics" class="px-3 py-2 rounded-lg hover:bg-slate-100 whitespace-nowrap">Аналитика</a>
                <a href="/deposit" class="px-3 py-2 rounded-lg hover:bg-slate-100 whitespace-nowrap">Вклад</a>
                <a href="/goals" class="px-3 py-2 rounded-lg hover:bg-slate-100 whitespace-nowrap">Цели</a>
                <a href="/settings" class="px-3 py-2 rounded-lg hover:bg-slate-100 whitespace-nowrap">Настройки</a>
            </div>
        </div>
    </nav>

    <header class="sm:hidden bg-white border-b border-slate-200 sticky top-0 z-10 px-4 py-3">
        <a href="/" class="font-bold text-lg text-indigo-700">Семейный бюджет</a>
    </header>

    <main class="max-w-3xl mx-auto px-4 py-4 sm:py-6">
        {% block content %}{% endblock %}
    </main>

    <nav class="mobile-bottom-nav" aria-label="Навигация">
        <a href="/">Дашборд</a>
        <a href="/plan">План</a>
        <a href="/deposit">Вклад</a>
        <a href="/analytics">Аналитика</a>
        <a href="/settings">Ещё</a>
    </nav>
</body>
</html>
