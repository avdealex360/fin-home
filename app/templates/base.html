<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Семейный бюджет{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen">
    <nav class="bg-white border-b border-slate-200 sticky top-0 z-10">
        <div class="max-w-3xl mx-auto px-4 py-3 flex flex-wrap gap-2 items-center justify-between">
            <a href="/" class="font-bold text-lg text-indigo-700">Семейный бюджет</a>
            <div class="flex flex-wrap gap-1 text-sm">
                <a href="/" class="px-3 py-2 rounded-lg hover:bg-slate-100">Дашборд</a>
                <a href="/transactions/new" class="px-3 py-2 rounded-lg hover:bg-slate-100">Операция</a>
                <a href="/plan/{{ now_date().year }}/{{ now_date().month }}" class="px-3 py-2 rounded-lg hover:bg-slate-100">План</a>
                <a href="/analytics" class="px-3 py-2 rounded-lg hover:bg-slate-100">Аналитика</a>
                <a href="/deposit" class="px-3 py-2 rounded-lg hover:bg-slate-100">Вклад</a>
                <a href="/goals" class="px-3 py-2 rounded-lg hover:bg-slate-100">Цели</a>
                <a href="/settings" class="px-3 py-2 rounded-lg hover:bg-slate-100">Настройки</a>
            </div>
        </div>
    </nav>
    <main class="max-w-3xl mx-auto px-4 py-6">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
