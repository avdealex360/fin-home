{% extends "base.html" %}
{% block title %}Цели — Семейный бюджет{% endblock %}
{% block content %}
<h1 class="text-2xl font-bold mb-6">Цели накоплений</h1>

<div class="space-y-4 mb-8">
    {% for goal in goals %}
    <div class="bg-white rounded-xl p-4 border border-slate-100">
        <form method="post" action="/goals/{{ goal.id }}/update" class="space-y-2">
            <input type="text" name="name" value="{{ goal.name }}" class="w-full p-2 border rounded-lg font-semibold">
            <div class="grid grid-cols-2 gap-2">
                <input type="text" name="target_amount" value="{{ goal.target_amount }}" placeholder="Цель" class="p-2 border rounded-lg">
                <input type="text" name="current_amount" value="{{ goal.current_amount }}" placeholder="Текущая" class="p-2 border rounded-lg">
            </div>
            <div class="grid grid-cols-2 gap-2">
                <input type="date" name="deadline" value="{% if goal.deadline %}{{ goal.deadline.isoformat() }}{% endif %}" class="p-2 border rounded-lg">
                <input type="text" name="monthly_contribution" value="{{ goal.monthly_contribution }}" placeholder="₽/мес" class="p-2 border rounded-lg">
            </div>
            {% if goal.target_amount > 0 %}
            <div class="w-full bg-slate-100 rounded-full h-2">
                <div class="h-2 rounded-full bg-emerald-500"
                    style="width: {{ (goal.current_amount / goal.target_amount * 100)|float|round(1) if goal.target_amount > 0 else 0 }}%"></div>
            </div>
            {% endif %}
            <button type="submit" class="btn-primary">Сохранить цель</button>
        </form>
        <form method="post" action="/goals/{{ goal.id }}/contribute" class="space-y-2 mt-3 pt-3 border-t">
            <input type="text" name="amount" inputmode="decimal" placeholder="Пополнение, ₽" class="w-full p-3 border rounded-xl">
            <input type="date" name="date" value="{{ today if today is defined else '' }}" class="w-full p-3 border rounded-xl">
            <button type="submit" class="btn-secondary">Добавить пополнение</button>
        </form>
    </div>
    {% endfor %}
</div>

<h2 class="text-lg font-semibold mb-3">Новая цель</h2>
<form method="post" action="/goals/" class="bg-white rounded-xl p-4 border space-y-3">
    <input type="text" name="name" placeholder="Название" class="w-full p-3 border rounded-xl" required>
    <input type="text" name="target_amount" placeholder="Целевая сумма" class="w-full p-3 border rounded-xl" required>
    <input type="text" name="monthly_contribution" placeholder="Ежемесячный взнос" class="w-full p-3 border rounded-xl">
    <input type="date" name="deadline" class="w-full p-3 border rounded-xl">
    <button type="submit" class="btn-primary">Создать цель</button>
</form>
{% endblock %}
