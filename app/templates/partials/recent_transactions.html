{% for tx in recent %}
<div class="flex items-center justify-between py-3 border-b border-slate-100 gap-2">
    <div class="min-w-0 flex-1">
        <div class="font-medium">
            {% if tx.type == 'income' %}+{% else %}-{% endif %}{{ tx.amount | money }} ₽
            {% if tx.category %}<span class="text-sm text-slate-500 block sm:inline">{{ tx.category.name }}</span>{% endif %}
        </div>
        <div class="text-xs text-slate-400">{{ tx.date.strftime('%d.%m.%Y') }}{% if tx.comment %} · {{ tx.comment }}{% endif %}</div>
    </div>
    <div class="flex gap-1 shrink-0">
        <a href="/transactions/{{ tx.id }}/edit" class="btn-touch text-sm text-indigo-600 border border-indigo-100 rounded-lg">Изм.</a>
        <button hx-delete="/transactions/{{ tx.id }}" hx-target="#recent-list" hx-swap="innerHTML"
            class="btn-touch text-sm text-red-600 border border-red-100 rounded-lg">Удал.</button>
    </div>
</div>
{% else %}
<div class="text-slate-500 text-sm py-4">Операций пока нет</div>
{% endfor %}
