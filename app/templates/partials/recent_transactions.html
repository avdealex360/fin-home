{% for tx in recent %}
<div class="flex items-center justify-between py-3 border-b border-slate-100">
    <div>
        <div class="font-medium">
            {% if tx.type == 'income' %}+{% else %}-{% endif %}{{ tx.amount | money }} ₽
            <span class="text-sm text-slate-500">
                {% if tx.category %}{{ tx.category.name }}{% endif %}
            </span>
        </div>
        <div class="text-xs text-slate-400">{{ tx.date.strftime('%d.%m.%Y') }}{% if tx.comment %} · {{ tx.comment }}{% endif %}</div>
    </div>
    <div class="flex gap-2">
        <a href="/transactions/{{ tx.id }}/edit" class="text-sm text-indigo-600 px-2 py-1">✎</a>
        <button hx-delete="/transactions/{{ tx.id }}" hx-target="#recent-list" hx-swap="innerHTML"
            class="text-sm text-red-600 px-2 py-1">✕</button>
    </div>
</div>
{% else %}
<div class="text-slate-500 text-sm py-4">Операций пока нет</div>
{% endfor %}
